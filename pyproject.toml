[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "soramimic-score"
version = "0.1.0"
description = "Evidence-preserving singing transcription and score contracts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "jasyllablesep==0.0.0",
  "kanasim==0.0.11",
  "requests>=2.31,<3",
]

[project.scripts]
soramimic-score = "soramimic_score.__main__:main"

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9,<1"]
test = ["httpx>=0.27,<1"]
audio = [
  "soramimic-yomi @ git+https://github.com/soramimic/soramimic-yomi@e9542850a49a8c424ba6685ca6814dcbb5b139a9",
  "demucs==4.0.1",
  "faster-whisper>=1.0,<2",
  "torch>=2.2,<2.9",
  "torchaudio>=2.2,<2.9",
  "transformers>=4.45.2,<4.46",
  "numpy>=1.24,<2.3",
  "librosa>=0.10,<0.12",
  "soundfile>=0.12",
  "mecab-python3>=1.0",
  "unidic-lite>=1.0",
  "mir-eval>=0.8.2",
  "pretty-midi>=0.2.10",
  "onnxruntime>=1.18,<2",
]

[tool.setuptools]
packages = ["soramimic_score"]

[tool.setuptools.package-data]
soramimic_score = ["score.html", "guidelines.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
